name: Proposer un astre
description: Un corps à ajouter aux coordonnées, aux planètes mineures, à la carte du ciel…
labels: ["enhancement"]
body:
  - type: input
    id: body
    attributes:
      label: Astre
      description: Son nom et, s'il en a une, sa désignation (numéro de planète mineure, comète, catalogue…).
      placeholder: "(10) Hygie, 12P/Pons-Brooks, M31…"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Astéroïde ou planète naine
        - Comète
        - Satellite d'une planète
        - Étoile
        - Objet du ciel profond (galaxie, nébuleuse, amas)
        - Autre
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Où le voir dans Céleste, et pourquoi ?
      description: Onglet Coordonnées, carte du ciel, évènements… et ce qu'il apporterait.
  - type: input
    id: version
    attributes:
      label: Version de Céleste
      placeholder: "4.4"
