name: Suggest a celestial body
description: A body to add to the coordinates, the minor planets, the sky map…
labels: ["enhancement"]
body:
  - type: input
    id: body
    attributes:
      label: Body
      description: Its name and, if it has one, its designation (minor planet number, comet, catalogue…).
      placeholder: "(10) Hygiea, 12P/Pons-Brooks, M31…"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Asteroid or dwarf planet
        - Comet
        - Moon of a planet
        - Star
        - Deep-sky object (galaxy, nebula, cluster)
        - Other
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Where should it appear in Céleste, and why?
      description: Coordinates tab, sky map, events… and what it would bring.
  - type: input
    id: version
    attributes:
      label: Céleste version
      placeholder: "4.7"
