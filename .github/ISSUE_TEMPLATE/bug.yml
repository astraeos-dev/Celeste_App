name: Report a problem
description: A wrong calculation, a broken display, a crash…
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happens?
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it?
      description: Date, place, tab, buttons… A screenshot helps a lot.
      placeholder: |
        1. Place: Paris, 01/11/2026 21:30 UT
        2. Planets tab
        3. …
  - type: input
    id: version
    attributes:
      label: Céleste version
      placeholder: "4.9"
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11
