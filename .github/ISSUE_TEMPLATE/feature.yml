name: Suggest a feature
description: An idea for Céleste
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What Céleste should do, and for which observation or use.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Examples, references, mock-ups…
  - type: input
    id: version
    attributes:
      label: Céleste version
      placeholder: "4.10"
