name: Android — test APK

# The Android build of Céleste (docs/ANDROID.md), from android/main.py, with the
# official tool of Qt for Python, pyside6-android-deploy:
#   1. the Android wheels of PySide6 and Shiboken (download.qt.io), for arm64 phones;
#   2. the Android NDK and SDK, downloaded by pyside-setup's script (cached);
#   3. the debug APK (python-for-android, Qt bootstrap), kept as an artifact.
# 4.14: the smallest app (version, theme): the tools are settled before the interface
# moves; the engine and the full interface come with the 5.0 alpha.
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**", "beta/**" ]
    paths: [ "android/**", "config.py", ".github/workflows/android.yml" ]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  PYSIDE_VERSION: "6.11.3"          # the desktop's PySide6; its Android wheels are for CPython 3.11
  ARCH: aarch64

jobs:
  apk:
    name: APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages (python-for-android)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool libffi-dev libssl-dev zlib1g-dev unzip zip

      - name: Qt for Python and its Android tools
        run: |
          pip install --upgrade pip
          pip install "PySide6==$PYSIDE_VERSION"
          git clone --depth 1 --branch "v$PYSIDE_VERSION" https://code.qt.io/pyside/pyside-setup "$RUNNER_TEMP/pyside-setup"
          pip install -r "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/requirements.txt" packaging

      - name: Android wheels of PySide6 and Shiboken
        run: |
          base=https://download.qt.io/official_releases/QtForPython
          mkdir -p "$RUNNER_TEMP/wheels"
          cd "$RUNNER_TEMP/wheels"
          for package in pyside6 shiboken6; do
            curl -fsSLO "$base/$package/$package-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_$ARCH.whl"
          done
          ls -l

      - name: Cache the Android NDK and SDK
        uses: actions/cache@v4
        with:
          path: ~/.pyside6_android_deploy
          key: android-ndk-sdk-${{ env.PYSIDE_VERSION }}

      - name: Android NDK and SDK
        run: |
          cd "$RUNNER_TEMP/pyside-setup"
          python tools/cross_compile_android/main.py --download-only --auto-accept-license --skip-update
          ls ~/.pyside6_android_deploy

      - name: Build the APK
        run: |
          project="$RUNNER_TEMP/celeste-android"
          mkdir -p "$project"
          cp android/main.py config.py "$project/"
          cd "$project"
          pyside6-android-deploy --name Celeste -f -v \
            --wheel-pyside="$RUNNER_TEMP/wheels/pyside6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_$ARCH.whl" \
            --wheel-shiboken="$RUNNER_TEMP/wheels/shiboken6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_$ARCH.whl"
          ls -l
          apk=$(ls *.apk | head -1)
          test -n "$apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          version=$(python -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE'); from config import APP_VERSION; print(APP_VERSION)")
          cp "$apk" "$GITHUB_WORKSPACE/dist/Celeste-$version-android-arm64-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Celeste-Android-arm64
          path: dist/*.apk
          if-no-files-found: error
