name: Android — test APK

# The Android build of Céleste (docs/ANDROID.md), from android/main.py, with the
# official tool of Qt for Python, pyside6-android-deploy:
#   1. the Android wheels of PySide6 and Shiboken (download.qt.io), for arm64 phones;
#   2. the Android NDK and SDK, downloaded by pyside-setup's script (cached);
#   3. the debug APK (python-for-android, Qt bootstrap), kept as an artifact, for arm64
#      phones and for the x86_64 emulator;
#   4. the x86_64 APK started on an Android emulator: its system log (logcat) is kept,
#      and main.py's self-test line must be in it.
# 4.14: the smallest app (version, theme): the tools are settled before the interface
# moves; the engine and the full interface come with the 5.0 alpha.
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**", "beta/**" ]
    paths: [ "android/**", "config.py", ".github/workflows/android.yml" ]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # PySide6 6.12: its deploy tool pins python-for-android (CPython 3.14 on the phone) and its
  # Android wheels are built for it (abi3). 6.11's tool followed python-for-android's moving
  # develop branch, whose Python no longer matched its cp311 wheels: the app could not load
  # libpython3.11.so and closed at once (seen on the emulator, 4.15).
  PYSIDE_VERSION: "6.12.0"
  WHEEL_TAG: cp310-abi3

jobs:
  apk:
    name: APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [ aarch64, x86_64 ]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages (python-for-android)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config cmake build-essential \
            libffi-dev libssl-dev zlib1g-dev libncurses-dev unzip zip

      - name: Qt for Python and its Android tools
        run: |
          pip install --upgrade pip
          pip install "PySide6==$PYSIDE_VERSION"
          pip install -r "$(python -c 'import os, PySide6; print(os.path.dirname(PySide6.__file__))')/scripts/requirements-android.txt"
          git clone --depth 1 --branch "v$PYSIDE_VERSION" https://code.qt.io/pyside/pyside-setup "$RUNNER_TEMP/pyside-setup"
          pip install -r "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/requirements.txt" packaging

      - name: Android wheels of PySide6 and Shiboken
        run: |
          base=https://download.qt.io/official_releases/QtForPython
          mkdir -p "$RUNNER_TEMP/wheels"
          cd "$RUNNER_TEMP/wheels"
          for package in pyside6 shiboken6; do
            curl -fsSLO "$base/$package/$package-$PYSIDE_VERSION-$PYSIDE_VERSION-$WHEEL_TAG-android_$ARCH.whl"
          done
          ls -l

      - name: Cache the Android NDK and SDK
        uses: actions/cache@v4
        with:
          path: ~/.pyside6_android_deploy
          key: android-ndk-sdk-${{ env.PYSIDE_VERSION }}-${{ matrix.arch }}

      - name: Android NDK and SDK
        run: |
          cd "$RUNNER_TEMP/pyside-setup"
          python tools/cross_compile_android/main.py --download-only --auto-accept-license --skip-update
          ls ~/.pyside6_android_deploy

      - name: Build the APK
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          project="$RUNNER_TEMP/celeste-android"
          mkdir -p "$project"
          cp android/main.py config.py "$project/"
          python android/make_images.py "$project"            # icon.png (launcher), logo.png
          cd "$project"
          wheels=(--wheel-pyside="$RUNNER_TEMP/wheels/pyside6-$PYSIDE_VERSION-$PYSIDE_VERSION-$WHEEL_TAG-android_$ARCH.whl"
                  --wheel-shiboken="$RUNNER_TEMP/wheels/shiboken6-$PYSIDE_VERSION-$PYSIDE_VERSION-$WHEEL_TAG-android_$ARCH.whl")
          # the configuration first, to give it Céleste's icon, then the build
          pyside6-android-deploy --init --name Celeste -f "${wheels[@]}"
          python - "$project/pysidedeploy.spec" "$project/icon.png" <<'PY'
          import configparser, sys
          spec = configparser.ConfigParser(comment_prefixes="#", allow_no_value=True, interpolation=None)
          spec.optionxform = str
          spec.read(sys.argv[1])
          spec["app"]["icon"] = sys.argv[2]
          with open(sys.argv[1], "w") as f:
              spec.write(f)
          print("icon:", spec["app"]["icon"])
          PY
          pyside6-android-deploy -c pysidedeploy.spec -f -v "${wheels[@]}"
          ls -l
          apk=$(ls *.apk | head -1)
          test -n "$apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          version=$(python -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE'); from config import APP_VERSION; print(APP_VERSION)")
          cp "$apk" "$GITHUB_WORKSPACE/dist/Celeste-$version-android-$ARCH-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Celeste-Android-${{ matrix.arch }}
          path: dist/*.apk
          if-no-files-found: error

  emulator:
    name: Start on an emulator (x86_64)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Celeste-Android-x86_64
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Package name
        id: package
        run: |
          apk=$(ls apk/*.apk | head -1)
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          package=$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "$apk: $package"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Start Céleste on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci_emulator.sh "${{ steps.package.outputs.apk }}" "${{ steps.package.outputs.package }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Celeste-Android-logcat
          path: logcat.txt
          if-no-files-found: ignore
