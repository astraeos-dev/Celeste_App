name: Beta — test build for Windows

# A Windows installer to try a version before its pull request, at each push on a work
# branch (claude/…, beta/…) or from the Actions tab (Run workflow, on any branch):
#   1. the tests (Python 3.12);
#   2. Céleste built as a beta (CELESTE_BETA = the run number: "4.12 bêta 7" in the
#      side panel), checked to start, and published as a GitHub *pre-release*
#      v<version>-beta.<n> with its installer, and as an artifact.
#
# Pre-releases are never offered by the automatic update (it asks GitHub for the latest
# release, which leaves them out): only who downloads one installs it. A beta updates
# itself to the release of its version once that is published. The three latest betas
# are kept; the older ones and their tags are deleted.
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**", "beta/**" ]
    paths-ignore: [ "**.md", "docs/**", "android/**", ".github/workflows/android.yml" ]

permissions:
  contents: write

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true          # a newer push replaces a build under way

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/cache@v4
        with:
          path: ~/.celeste
          key: ephemeris-de440s
      - run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: pytest tests/ -q --tb=short

  windows:
    name: Windows beta
    needs: tests
    runs-on: windows-latest
    env:
      CELESTE_BETA: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.celeste
          key: ephemeris-de440s
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build, self-test and installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_exe.py
      - name: Version
        id: version
        shell: bash
        run: echo "release=$(python -c 'from config import APP_RELEASE; print(APP_RELEASE)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Celeste-${{ steps.version.outputs.release }}-Setup
          path: dist/Celeste-*-Setup.exe
          if-no-files-found: error
      - name: Publish the pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          version=$(python -c "from config import APP_VERSION; print(APP_VERSION)")
          {
            echo "Test version, built from the branch \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA::7})."
            echo "Not offered by the automatic update. Install it over the current version; the release $version will replace it."
            echo
            if python scripts/release_notes.py "$version" notes.md 2>/dev/null; then
              cat notes.md
              echo
            fi
            echo "Commits since master:"
            git log --format='- %s' "origin/master..HEAD" 2>/dev/null | head -30
          } > beta-notes.md
          cat beta-notes.md
          cd dist
          setup="Celeste-$RELEASE-Setup.exe"
          sha256sum "$setup" | sed 's/ \*/  /' > "$setup.sha256"
          gh release create "v$RELEASE" "$setup" "$setup.sha256" --prerelease \
            --target "$GITHUB_SHA" --title "Céleste ${RELEASE/-beta./ beta } (test)" --notes-file ../beta-notes.md
      - name: Keep the three latest betas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-beta\\.")))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
