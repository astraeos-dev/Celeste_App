name: Build — application Windows

# Construit Céleste.exe pour Windows (PyInstaller, éphéméride incluse),
# vérifie que l'application démarre, et publie l'archive en artefact.
# À lancer depuis l'onglet Actions, ou en poussant un tag v*.
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the JPL DE440 ephemeris
        uses: actions/cache@v4
        with:
          path: ~/.celeste
          key: ephemeris-de440s

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6"

      - name: Build, self-test and zip
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_exe.py

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: Celeste-Windows
          path: dist/Celeste-*.zip
          if-no-files-found: error
