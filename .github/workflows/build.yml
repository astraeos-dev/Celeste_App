name: Build — application autonome

# Construit Céleste pour Windows, macOS et Linux (PyInstaller, éphéméride
# incluse), vérifie que chaque application démarre, et publie les archives
# en artefacts. À lancer depuis l'onglet Actions, ou en poussant un tag v*.
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the JPL DE440 ephemeris
        uses: actions/cache@v4
        with:
          path: ~/.celeste
          key: ephemeris-de440s

      - name: Install system libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6"

      - name: Build, self-test and zip
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_exe.py

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: Celeste-${{ runner.os }}
          path: dist/Celeste-*.zip
          if-no-files-found: error
