name: Build — application Windows

# Construit Céleste.exe pour Windows (PyInstaller, éphéméride incluse),
# vérifie que l'application démarre, puis publie en artefacts le programme
# d'installation (Inno Setup) et le dossier de l'application.
# À lancer depuis l'onglet Actions, ou en poussant un tag v*.
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the JPL DE440 ephemeris
        uses: actions/cache@v4
        with:
          path: ~/.celeste
          key: ephemeris-de440s

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6"

      # Pour un tag v<version>, le tag et APP_VERSION (config.py) doivent concorder
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "from config import APP_VERSION; print(APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} != APP_VERSION $version (config.py)"
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build, self-test, zip and installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_exe.py

      # Les artefacts sont téléchargés en .zip : l'installateur tel quel, et le
      # dossier de l'application (sans second zip à l'intérieur)
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Celeste-Windows-Setup
          path: dist/Celeste-*-Setup.exe
          if-no-files-found: error

      - name: Upload the application folder
        uses: actions/upload-artifact@v4
        with:
          name: Celeste-Windows
          path: dist/Celeste/
          if-no-files-found: error
