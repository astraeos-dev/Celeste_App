name: Build — Windows application

# Builds Céleste.exe for Windows (PyInstaller), checks that the application
# starts, publishes the installer (Inno Setup) and the application folder as
# artifacts and — for a new version — a GitHub Release, from which the
# installed application updates itself (updater.py).
#
# Triggers:
#   • APP_VERSION changes in config.py on master: build and Release v<version>
#     (nothing when that version is already published);
#   • a v<version> tag pushed by hand: build and Release of that tag;
#   • the Actions tab (Run workflow): build and artifacts only.
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ "config.py" ]
    tags: [ "v*", "!v*-beta*" ]      # the betas are the Beta workflow's

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # the tags: is this version already published?

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Version, and what to do: build (yes/no), Release (yes/no)
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "from config import APP_VERSION; print(APP_VERSION)")
          build=true
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME != APP_VERSION $version (config.py)"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "Céleste $version is already published: nothing to build."
              build=false
            else
              release=true
            fi
          fi
          if [[ "$release" == "true" ]] && ! python scripts/release_notes.py "$version" > /dev/null; then
            echo "::error::CHANGELOG.md has no section \"## $version\": the Release would have no note"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Cache the JPL DE440 ephemeris
        if: steps.version.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.celeste
          key: ephemeris-de440s

      - name: Install Python dependencies
        if: steps.version.outputs.build == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6"

      - name: Install Inno Setup
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build, self-test, zip and installer
        if: steps.version.outputs.build == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_exe.py

      # Artifacts download as .zip files: the installer as it is, and the
      # application folder (no second zip inside)
      - name: Upload the installer
        if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Celeste-Windows-Setup
          path: dist/Celeste-*-Setup.exe
          if-no-files-found: error

      - name: Upload the application folder
        if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Celeste-Windows
          path: dist/Celeste/
          if-no-files-found: error

      # The Release: the installer and its SHA-256 checksum, which the
      # application verifies before installing an update, and its note, the
      # version's section of CHANGELOG.md (shown by the update window)
      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/release_notes.py "$VERSION" release-notes.md
          cat release-notes.md
          cd dist
          setup="Celeste-$VERSION-Setup.exe"
          sha256sum "$setup" | sed 's/ \*/  /' > "$setup.sha256"
          cat "$setup.sha256"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$setup" "$setup.sha256" --clobber
            gh release edit "v$VERSION" --notes-file ../release-notes.md
          else
            gh release create "v$VERSION" "$setup" "$setup.sha256" \
              --target "$GITHUB_SHA" --title "Céleste $VERSION" --notes-file ../release-notes.md
          fi
