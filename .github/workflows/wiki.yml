name: Wiki — publish the pages

# Copies docs/wiki/ into the repository's GitHub wiki on every change on master
# (or from the Actions tab). The pages are edited in the repository: a page
# changed directly in the wiki would be overwritten.
#
# Once, before the first publication: enable the wiki (Settings › General ›
# Features › Wikis) and create a first page there, whatever it is.
on:
  push:
    branches: [ master ]
    paths: [ "docs/wiki/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish the wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docs/wiki to the wiki
        env:
          # a personal token (secret WIKI_TOKEN) when GITHUB_TOKEN cannot write to the wiki
          TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::Wiki not found: enable it (Settings › Features › Wikis) and create a first page."
            exit 1
          fi
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          # links between pages: "Page.md" in the repository, "Page" in the wiki
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' wiki/*.md
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git commit -m "Pages of docs/wiki (${GITHUB_SHA::7})"
          git push
